# Build and deploy the brand docs site to Cloudflare Pages.
#
# This replaces the previous GitHub Pages deployment (actions/upload-pages-artifact
# + actions/deploy-pages) with a direct Cloudflare Pages deploy via
# cloudflare/wrangler-action. The Pages project is "brand-docs" (production alias
# https://brand-docs.pages.dev, custom domain https://brand.kolektiv.computer);
# see the repo-root wrangler.toml.
#
# CI deploy requires a valid CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID).
# The org token is currently IP-restricted, so GitHub runners get Cloudflare
# error 9109 — fix later (allowlist the runner egress or use a dedicated token).
#
# Local deploy:
#   pnpm build
#   pnpm dlx wrangler@4.131.1 pages deploy dist --project-name=brand-docs --branch=main
#
# docs/public/CNAME is a leftover GitHub Pages artifact and can be removed after
# the DNS cutover to Cloudflare Pages.

name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Build docs
        run: pnpm build
        env:
          VITE_DOCS_SITE: ${{ vars.DOCS_SITE || 'https://brand.kolektiv.computer' }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: "4.131.1"
          workingDirectory: .
          command: pages deploy dist --project-name=brand-docs --branch=${{ github.ref_name }}

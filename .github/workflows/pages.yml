name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      # NOTE: `@kolektiv/brand-docs` currently depends on
      # `@kolektiv/common-docs-chrome` via `link:../../common-docs-chrome`, which
      # only resolves when that sibling checkout exists (and is built) locally.
      # CI here has no sibling checkout, so the docs build only works once the
      # package is published to the @kolektiv registry and the dependency is
      # switched to `^0.0.1-SNAPSHOT.1` (see the TODO in docs/package.json).
      # VITE_DOCS_SITE and `base: './'` are unchanged.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Build docs
        run: pnpm build
        env:
          VITE_DOCS_SITE: ${{ vars.DOCS_SITE || 'https://brand.kolektiv.computer' }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
